name: Android beta verification

on:
  push:
    branches: [arena/bfda4e32-upi-expense-tracker-beta]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android 36.1 SDK
        run: sdkmanager --install 'platforms;android-36.1' 'platforms;android-29' 'build-tools;36.0.0' 'platform-tools'
      - name: Unit tests and debug APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Verify Android 10 minimum and absence of network permission
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep "sdkVersion:'29'"
          if "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$APK" | grep -F 'android.permission.INTERNET'; then
            echo 'INTERNET was reintroduced in the merged manifest' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upi-tracker-2.0.0-beta.1-debug-test-copy
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
          retention-days: 14

  android-10-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android 36.1 SDK and API 29 emulator
        run: sdkmanager --install 'platforms;android-36.1' 'platforms;android-29' 'build-tools;36.0.0' 'platform-tools' 'emulator' 'system-images;android-29;default;x86_64'
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          disable-animations: true
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.goushik.upiwallet.release.BetaSmokeTest
