name: Android beta verification

# Builds the 2.1.0-beta.1 test copy, proves it on a real Android 10 (API 29) emulator, and publishes the
# debug APK as an artifact — but ONLY after .github/scripts/verify_beta_apk.py has checked the actual
# binary (package id, version, minSdk 29, no INTERNET, debug-key signature, size, SHA-256). A build that
# fails any check fails the job and uploads nothing, so a broken APK never reaches a phone.
on:
  push:
    branches: ['arena/**', main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit tests, lint, debug + release builds, APK checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '14742923'
          packages: 'platform-tools'
      - name: Install Android 36.1 and Android 10 (API 29) SDKs
        run: |
          set -o pipefail
          echo "Android SDK: $ANDROID_HOME; sdkmanager: $(command -v sdkmanager || true)"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install 'platforms;android-36.1' 'platforms;android-29' 'build-tools;36.0.0' 'platform-tools' > sdk-install.log 2>&1 || {
            echo "::error title=SDK setup::$(tail -n 45 sdk-install.log | python3 -c 'import sys; print(sys.stdin.read().replace("%","%25").replace("\n","%0A").replace("\r","%0D"))')"
            exit 1
          }
      - name: Read the version the build script declares
        id: version
        run: |
          set -euo pipefail
          code=$(grep -oP '^\s*versionCode = \K[0-9]+' app/build.gradle.kts | head -1)
          name=$(grep -oP '^\s*versionName = "\K[^"]+' app/build.gradle.kts | head -1)
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Declared in app/build.gradle.kts: versionCode $code, versionName $name" >> "$GITHUB_STEP_SUMMARY"
      - name: Unit tests and debug + release builds
        run: |
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease > gradle-build.log 2>&1 || {
            echo "::error title=Gradle build output::$(tail -n 160 gradle-build.log | python3 -c 'import sys; print(sys.stdin.read().replace("%","%25").replace("\n","%0A").replace("\r","%0D"))')"
            exit 1
          }
      - name: Verify the built APKs (version, package id, minSdk 29, no INTERNET, signature, size, SHA-256)
        run: |
          python3 .github/scripts/verify_beta_apk.py \
            --report app/build/reports/beta-verification.txt \
            --checksums app/build/outputs/checksums.txt
      # Runs LAST among the checks so a lint error can never hide the build+APK results above. Gradle
      # prints only the first lint error, so .github/scripts/lint_report.py prints all of them.
      - name: Lint
        run: |
          set -o pipefail
          status=0
          ./gradlew --no-daemon :app:lint > gradle-lint.log 2>&1 || status=$?
          python3 .github/scripts/lint_report.py --annotate --out app/build/reports/lint-errors.txt
          if [ "$status" -ne 0 ]; then
            echo "::error title=Gradle lint output::$(tail -n 25 gradle-lint.log | python3 -c 'import sys; print(sys.stdin.read().replace("%","%25").replace("\n","%0A").replace("\r","%0D"))')"
          fi
          exit "$status"
      - name: Summarise unit tests
        if: always()
        run: |
          python3 - <<'PY'
          import glob
          import os
          import xml.etree.ElementTree as ET

          lines = ["### Unit tests (`:app:testDebugUnitTest`)"]
          files = sorted(glob.glob("app/build/test-results/testDebugUnitTest/*.xml"))
          if not files:
              lines.append("No test results were produced — the test task did not reach the point of running tests.")
          else:
              totals = dict.fromkeys(("tests", "failures", "errors", "skipped"), 0)
              for path in files:
                  root = ET.parse(path).getroot()
                  for key in totals:
                      totals[key] += int(root.get(key, 0))
              lines.append(
                  f"{len(files)} test classes · **{totals['tests']} tests**, "
                  f"{totals['failures']} failures, {totals['errors']} errors, {totals['skipped']} skipped"
              )
              for path in files:
                  root = ET.parse(path).getroot()
                  for case in root.iter("testcase"):
                      for bad in list(case.findall("failure")) + list(case.findall("error")):
                          message = (bad.get("message") or bad.get("type") or "").replace("\n", " ")[:200]
                          lines.append(f"- `{case.get('classname')}.{case.get('name')}` — {message}")
          print("\n".join(lines))
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as handle:
                  handle.write("\n".join(lines) + "\n")
          totals_line = next((line for line in lines if "tests" in line and "classes" in line), lines[-1])
          print("::notice title=Unit tests::" + totals_line.replace("**", "").replace("·", "|"), flush=True)
          PY
      - name: Upload the debug test-copy APK
        uses: actions/upload-artifact@v4
        with:
          name: upi-tracker-${{ steps.version.outputs.name }}-debug-test-copy
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/checksums.txt
            app/build/reports/beta-verification.txt
          if-no-files-found: error
          retention-days: 14

  android-10-smoke:
    name: API 29 instrumentation smoke tests
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '14742923'
          packages: 'platform-tools'
      - name: Install Android 36.1 SDK and the API 29 emulator
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install 'platforms;android-36.1' 'platforms;android-29' 'build-tools;36.0.0' 'platform-tools' 'emulator' 'system-images;android-29;default;x86_64'
      # BetaSmokeTest checks on a real Android 10 device image that the app installs, launches, carries no
      # INTERNET permission, and migrates a populated v7 database without losing a payment or an account.
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          disable-animations: true
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.goushik.upiwallet.release.BetaSmokeTest
      - name: Upload instrumentation results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-results
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
          if-no-files-found: ignore
          retention-days: 7
